name: Collect Top Heroes posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2,8,14,20 * * *"

concurrency:
  group: top-heroes-collector
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch public posts
        run: python cli.py fetch --headless

      - name: Validate JSON
        run: python cli.py validate

      - name: Prepare static dashboard data
        run: |
          mkdir -p site/data site/api
          cp data/posts.json site/data/posts.json
          cp data/posts.json site/api/posts.json

      - name: Commit updated JSON
        run: |
          git config user.name "top-heroes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json site/data/posts.json site/api/posts.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "chore: update Top Heroes posts"
            git push
          fi

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
